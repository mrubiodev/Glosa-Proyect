[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glosa-app"
version = "0.1.0"
description = "Composición y arranque"
requires-python = ">=3.11"
dependencies = ["glosa-core", "glosa-templates"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/glosa_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glosa-storage"
version = "0.1.0"
description = "Adaptadores de persistencia"
requires-python = ">=3.11"
dependencies = ["glosa-core"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."glosa.adapters"]
storage = "glosa_storage:register"

[tool.hatch.build.targets.wheel]
packages = ["src/glosa_storage"]

[tool.pytest.ini_options]
testpaths = ["tests"]

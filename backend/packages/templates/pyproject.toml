[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glosa-templates"
version = "0.1.0"
description = "Plantillas de cliente: carga, herencia, validación y registro de adaptadores"
requires-python = ">=3.11"
dependencies = ["glosa-core", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/glosa_templates"]

[tool.pytest.ini_options]
testpaths = ["tests"]

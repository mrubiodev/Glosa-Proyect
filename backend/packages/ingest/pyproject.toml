[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glosa-ingest"
version = "0.1.0"
description = "Extractores y chunkers de documentos"
requires-python = ">=3.11"
dependencies = ["glosa-core"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/glosa_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

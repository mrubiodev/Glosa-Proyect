  <text x="116" y="382" fill="#d5e2e9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Documentos → RAG → MCP</text>
  <text x="116" y="422" fill="#8faabb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Acceso controlado · Trazabilidad · Adaptación por plantillas</text>
